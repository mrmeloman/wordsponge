<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 10px;
    }
    h3 {
      margin: 4px 0;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      flex: none;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
    }
    input:checked + .slider {
      background-color: #2196F3;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    input:focus-visible + .slider {
      outline: 2px solid #2196F3;
      outline-offset: 2px;
    }
    input:disabled + .slider {
      cursor: default;
      opacity: 0.4;
    }
    .slider.round {
      border-radius: 24px;
    }
    .slider.round:before {
      border-radius: 50%;
    }
    .domain_name {
      font-size: 12px;
      color: #999;
      margin-bottom: 10px;
    }
    .status {
      margin-bottom: 10px;
    }
    #pause {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .hint {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
      min-height: 1em;
    }
    .switches {
      margin-top: 14px;
      text-align: left;
    }
    .switch-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
    }
    .settings {
      padding:20px 0 10px 0;
    }
    .intensity {
      padding-top: 16px;
    }
  </style>
</head>
<body>
<h3>Word Sponge</h3>
<div class="domain_name"></div>
<div class="status" id="status"></div>
<button id="pause" hidden>Pause on this page</button>
<div class="hint" id="pauseHint"></div>
<div class="switches">
  <label class="switch-row">
    <span>On for this page</span>
    <span class="toggle-switch">
      <input type="checkbox" id="pageToggle" checked>
      <span class="slider round"></span>
    </span>
  </label>
  <label class="switch-row">
    <span>On for this site</span>
    <span class="toggle-switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider round"></span>
    </span>
  </label>
</div>
<div class="intensity">
  <label for="intensity">Intensity</label>
  <select id="intensity"></select>
</div>
<div class="settings">
  <a href="settings.html" id="settings-link">Settings</a>
</div>

<script src="frequency.js"></script>
<script src="popup.js"></script>
</body>
</html>
